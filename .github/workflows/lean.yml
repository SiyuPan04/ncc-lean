name: Lean verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check repository contents
        shell: pwsh
        run: ./scripts/check-repository.ps1
      - name: Build with the pinned Lean toolchain
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          build: true
          build-args: "--wfail"
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Check source coverage and transitive axioms
        shell: pwsh
        run: ./build.ps1
